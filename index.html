<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الوحدة الأولى · Unit 1 Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fc;--card:#fff;--ink:#14213d;--mut:#5b6785;--line:#dbe3f3;--pri:#1d4ba8;--on:#fff;--acc:#d9480f;--okb:#e2f6ee;--badb:#fdeaea;--sel:#e8effc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f36;--ink:#e8edf9;--mut:#9aa7c7;--line:#2a3555;--pri:#7ea6ff;--on:#0e1424;--acc:#ff8a57;--okb:#123326;--badb:#3a1c1c;--sel:#1f2b4d}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f36;--ink:#e8edf9;--mut:#9aa7c7;--line:#2a3555;--pri:#7ea6ff;--on:#0e1424;--acc:#ff8a57;--okb:#123326;--badb:#3a1c1c;--sel:#1f2b4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Cairo,'Segoe UI',Tahoma,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
#pb{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#pl{font-size:13px;color:var(--mut);white-space:nowrap}
#lg{border:1.5px solid var(--pri);color:var(--pri);background:none;border-radius:20px;padding:2px 14px;font-weight:700}
main{max-width:760px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#1d4ba8,#0f2e6e);color:#fff;border-radius:20px;padding:24px 20px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:24px;line-height:1.5}
.hero p{margin:0 0 6px;opacity:.9}
.hero .by{font-weight:800;opacity:1;margin-bottom:12px}
.chip,.mk{background:#d9480f;color:#fff;border-radius:20px;padding:2px 14px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card h2{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:17px;margin:0 0 8px;color:var(--pri)}
.intro{background:var(--sel);border-radius:12px;padding:10px 12px;margin:0 0 6px;font-weight:600}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q p{margin:0 0 8px}
.q.ok{background:var(--okb);border-radius:12px;padding:12px;margin:6px 0;border:0}
.q.bad{background:var(--badb);border-radius:12px;padding:12px;margin:6px 0;border:0}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.o{position:relative;display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:var(--card)}
.o input{position:absolute;opacity:0}
.o:focus-within{outline:2px solid var(--pri)}
.k{width:26px;height:26px;border-radius:50%;background:var(--sel);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.o.on{border-color:var(--pri);background:var(--sel)}
.o.on .k{background:var(--pri);color:var(--on)}
.fb{margin-top:8px;font-size:14px}
.go{display:block;width:100%;background:var(--pri);color:var(--on);border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800}
.res{text-align:center}
.big{font-size:56px;font-weight:800;color:var(--acc);line-height:1.2}
.big small{font-size:22px;color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.ctr{text-align:center;margin-top:16px;font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="bar"><i id="pb"></i></div><span id="pl"></span><button id="lg"></button></header>
<main><div id="app"></div></main>
<script>
const K={ar:['أ','ب','ج','د'],en:['A','B','C','D']};
const A=[1,2,2,1,0,1,2,1,0,1,0,1,1,2,0,0,0,0,1,0],O=[0,8,12,16];
const D={
ar:{dir:'rtl',btn:'English',qn:'س',title:'اختبار الوحدة الأولى — دراسة المعلومات',sub:'البرمجة والذكاء الاصطناعي · الصف الأول البكالوريا · 2026/2027',by:'إعداد: م/ أحمد تامر',total:'المجموع: 40 درجة · 20 سؤالًا',
secs:[
{t:'السؤال الأول · المفاهيم الأساسية',m:'16 درجة (2 لكل سؤال)',q:[
['حقائق تُمثل بالأرقام أو الأحرف أو الرموز تسمى:',['المعلومات','البيانات','المعرفة','الوسائط']],
['الخاصية التي تعني «بمجرد إنشاء المعلومات لا يمكن محوها بالكامل» هي:',['الانتشار','قابلية التكرار','الاستمرارية','الثقافة الإعلامية']],
['محرك أقراص USB يُصنَّف ضمن وسائط:',['التعبير','النقل','التسجيل','الجماهيري']],
['المعلومات التي تحصل عليها من طرف ثالث كالكتب والصحف تسمى:',['أولية','ثانوية','مضللة','خام']],
['معلومات خط الطول والعرض المضمنة في صور الهاتف الذكي تسمى:',['العلامة الجغرافية','التنمر الإلكتروني','انتحال الشخصية','التخزين السحابي']],
['الانغماس المفرط في الإنترنت لدرجة تعطيل حياتك اليومية يسمى:',['الجريمة الإلكترونية','إدمان الإنترنت','الهندسة الاجتماعية','التسريب']],
['قيام شخص بانتحال شخصية فرد أو مؤسسة لسرقة كلمات المرور يسمى:',['تسريب المعلومات','التنمر الإلكتروني','انتحال الشخصية','الانتشار']],
['تفسير معلومات الوسائط بدقة هو تعريف:',['أخلاقيات المعلومات','الثقافة الإعلامية','التحقق المتبادل','قابلية التكرار']]]},
{t:'السؤال الثاني · الأخلاقيات والتحقق',m:'8 درجات (2 لكل سؤال)',q:[
['الصور والنصوص تُصنَّف ضمن وسائط:',['التعبير','النقل','التسجيل','الجماهيري']],
['أخلاقيات المعلومات تلزمنا:',['فقط عند وجود قوانين','دائمًا حتى في غياب القوانين','على الإنترنت فقط','في المدرسة فقط']],
['لماذا نستخدم التحقق المتبادل مع المعلومات الثانوية؟',['لأنها قد تختلف عن المعلومات الأصلية','لأنها دائمًا دقيقة تمامًا','لأنها معلومات شخصية','لأنها بيانات خام']],
['مشاركة صور الآخرين المتاحة على الإنترنت:',['مسموحة دائمًا','تتطلب إذن أصحابها أولًا','مسموحة إذا كانت الصورة جميلة','مسموحة للطلاب فقط']]]},
{t:'السؤال الثالث · مصطلحات الوحدة',m:'8 درجات (2 لكل سؤال)',q:[
['المعلومات التي تم تحليلها وتنظيمها بشكل منهجي لحل المشكلات تسمى:',['البيانات','المعرفة','الوسائط','الاستمرارية']],
['خدمات توفر منصات للأفراد للتواصل مع بعضهم البعض على الإنترنت تسمى:',['الهندسة الاجتماعية','التسويق الاجتماعي','خدمات الشبكات الاجتماعية','نظام الشبكة الاجتماعية']],
['المعلومات الكاذبة التي تُنشر عمدًا أو الشائعات التي لا أساس لها تسمى:',['المعلومات المضللة','المعلومات الأولية','التحقق المتبادل','الثقافة الإعلامية']],
['الكشف عن معلومات شخصية يجب أن تظل سرية لطرف ثالث يسمى:',['تسريب المعلومات الشخصية','التحقق المتبادل','الانتشار','قابلية التكرار']]]},
{t:'السؤال الرابع · حالة دراسية',m:'8 درجات (2 لكل سؤال)',i:'قررت مدرستك نشر صور الطلاب في الرحلات على صفحتها الرسمية.',q:[
['نشر وجوه الطلاب وأسمائهم يكشف:',['معلومات شخصية عن الطلاب','معلومات مضللة','معلومات أولية فقط','وسائط تسجيل فقط']],
['إذا حملت الصور علامة جغرافية فإن الخطر هو:',['كشف أماكن وجود الطلاب','زيادة جودة الصور','حذف الصور تلقائيًا','زيادة سرعة الإنترنت']],
['من ناحية أخلاقيات المعلومات، ما الذي يجب فعله قبل النشر؟',['النشر فورًا','أخذ موافقة أولياء الأمور','إضافة الأسماء الكاملة للطلاب','لا شيء لأنها صفحة مدرسة']],
['ما الإجراء الوقائي المناسب؟',['إزالة العلامة الجغرافية من الصور قبل النشر','إضافة عناوين منازل الطلاب للصور','السماح للجميع بإعادة نشرها','مشاركة كلمة مرور الصفحة']]]}],
u:{sub:'تسليم وتصحيح',again:'إعادة الاختبار',prog:'تمت الإجابة',res:'نتيجتك',ans:'الإجابة الصحيحة',msg:['ممتاز! أنت جاهز للوحدة التالية.','جيد جدًا — راجع الأسئلة الخاطئة.','راجع مصطلحات الوحدة وأعد المحاولة.']}},
en:{dir:'ltr',btn:'العربية',qn:'Q',title:'Unit 1 Exam — Studying Information',sub:'Programming & AI · Grade 1 Baccalaureate · 2026/2027',by:'Prepared by: Eng. Ahmed Tamer',total:'Total: 40 marks · 20 questions',
secs:[
{t:'Question 1 · Core concepts',m:'16 marks (2 each)',q:[
['Facts represented by numbers, letters or symbols are called:',['Information','Data','Knowledge','Media']],
['The property meaning "once information is created it can never be fully erased" is:',['Dissemination','Replicability','Persistence','Media literacy']],
['A USB flash drive is classified as which type of media?',['Expression','Transmission','Recording','Mass']],
['Information you get from a third party, such as books and newspapers, is called:',['Primary','Secondary','Misleading','Raw']],
['Latitude and longitude embedded in smartphone photos are called:',['Geotag','Cyberbullying','Impersonation','Cloud storage']],
['Excessive internet use that disrupts your daily life is called:',['Cybercrime','Internet addiction','Social engineering','Leakage']],
['A person pretending to be an individual or organization to steal passwords is committing:',['Information leakage','Cyberbullying','Impersonation','Dissemination']],
['Accurately interpreting media information is the definition of:',['Information ethics','Media literacy','Cross-checking','Replicability']]]},
{t:'Question 2 · Ethics and verification',m:'8 marks (2 each)',q:[
['Images and texts are classified as which type of media?',['Expression','Transmission','Recording','Mass']],
['Information ethics oblige us:',['Only when laws exist','Always, even where there are no laws','Only online','Only at school']],
['Why do we use cross-checking with secondary information?',['Because it may differ from the original','Because it is always perfectly accurate','Because it is personal information','Because it is raw data']],
['Sharing other people\'s photos that are available online:',['Is always allowed','Requires their owners\' permission first','Is allowed if the photo looks nice','Is allowed for students only']]]},
{t:'Question 3 · Unit terms',m:'8 marks (2 each)',q:[
['Information that has been analyzed and organized systematically to solve problems is called:',['Data','Knowledge','Media','Persistence']],
['Services that provide platforms for people to connect with each other online are called:',['Social engineering','Social marketing','Social networking services','Social network system']],
['False information published deliberately, or baseless rumors, is called:',['Misinformation','Primary information','Cross-checking','Media literacy']],
['Disclosing personal information that should stay secret to a third party is called:',['Personal information leakage','Cross-checking','Dissemination','Replicability']]]},
{t:'Question 4 · Case study',m:'8 marks (2 each)',i:'Your school decided to post student photos from trips on its official page.',q:[
['Showing students\' faces and names reveals:',['Personal information about the students','Misinformation','Primary information only','Recording media only']],
['If the photos carry a geotag, the risk is:',['Revealing where students are','Higher photo quality','Photos being deleted automatically','Faster internet']],
['From an information-ethics view, what should be done before posting?',['Post immediately','Get parents\' consent','Add students\' full names','Nothing, since it is a school page']],
['Which precaution is appropriate?',['Remove the geotag from photos before posting','Add students\' home addresses to photos','Let everyone repost them','Share the page password']]]}],
u:{sub:'Submit & grade',again:'Retake exam',prog:'answered',res:'Your score',ans:'Correct answer',msg:['Excellent! You are ready for the next unit.','Very good — review the questions you missed.','Review the unit terms and try again.']}}};
const $=s=>document.querySelector(s);
const sum=a=>a.reduce((x,y)=>x+y,0);
let lang='ar',done=false,S=Array(20).fill(-1);
function upd(){const n=S.filter(v=>v>=0).length;$('#pb').style.width=n*5+'%';$('#pl').textContent=n+'/20 '+D[lang].u.prog}
function render(){
const d=D[lang],u=d.u,k=K[lang],dis=done?'disabled':'',ok=i=>S[i]==A[i];
document.documentElement.lang=lang;document.documentElement.dir=d.dir;$('#lg').textContent=d.btn;
let h=`<section class="hero"><h1>${d.title}</h1><p>${d.sub}</p><p class="by">${d.by}</p><span class="chip">${d.total}</span></section>`;
if(done){const sc=S.map((v,i)=>ok(i)?2:0),t=sum(sc);
h+=`<section class="card res"><div>${u.res}</div><div class="big">${t}<small>/40</small></div><p>${u.msg[t>=36?0:t>=28?1:2]}</p><p class="mut">${d.secs.map((s,j)=>d.qn+(j+1)+': '+sum(sc.slice(O[j],O[j]+s.q.length))+'/'+s.q.length*2).join(' · ')}</p></section>`}
h+=d.secs.map((s,j)=>`<section class="card"><h2>${s.t}<span class="mk">${s.m}</span></h2>${s.i?`<p class="intro">${s.i}</p>`:''}`+s.q.map((q,n)=>{const i=O[j]+n;
return `<div class="q${done?(ok(i)?' ok':' bad'):''}"><p><b>${i+1}.</b> ${q[0]}</p><div class="opts">`+q[1].map((o,x)=>`<label class="o${S[i]==x?' on':''}"><input type="radio" name="a${i}" value="${x}" ${S[i]==x?'checked':''} ${dis}><span class="k">${k[x]}</span>${o}</label>`).join('')+`</div>${done&&!ok(i)?`<div class="fb">✔ ${u.ans}: ${k[A[i]]} — ${q[1][A[i]]}</div>`:''}</div>`}).join('')+'</section>').join('');
h+=done?`<button class="go" id="again">${u.again}</button>`:`<button class="go" id="sub">${u.sub}</button>`;
h+=`<p class="ctr">${d.by}</p>`;
$('#app').innerHTML=h;upd()}
const keep=f=>{const y=scrollY;f();render();scrollTo(0,y)};
const app=$('#app');
app.addEventListener('change',e=>{const t=e.target;if(t.name&&t.name[0]=='a')keep(()=>S[+t.name.slice(1)]=+t.value)});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id=='sub'){done=true;render();scrollTo(0,0)}
else if(b.id=='again'){S.fill(-1);done=false;render();scrollTo(0,0)}});
$('#lg').onclick=()=>{lang=lang=='ar'?'en':'ar';keep(()=>0)};
render();
</script>
</body>
</html>
